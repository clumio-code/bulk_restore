AWSTemplateFormatVersion: '2010-09-09'
Description: Clumio bulk restore + list combined deployment
Parameters:
  LambdaCodeLocationBucket:
    Description: S3 Bucket that contains the lambda zip file
    Type: String
    Default: clumio-bulk-restore
  LambdaIAMRole:
    Description: Role to run lambda functions
    Type: String
    Default: arn:aws:iam::<account_id>:role/clumio-bulk-restore-role
  LambdaZipObjectPrefix:
    Description: Prefix of the Lambda zip object key in LambdaCodeLocationBucket. The build version is appended at deploy time (final key is "<prefix>-<version>.zip"), so each release pulls a unique S3 key and CloudFormation re-deploys the Lambda code.
    Type: String
    Default: clumio_bulk_restore
  ClumioTokenArn:
    Description: ARN of the Clumio token secret in AWS Secrets Manager, if left empty, API token has to be passed as input during state machine execution.
    Type: String
    Default: arn:aws:secretsmanager:<aws_region>:<aws_account_id>:secret:clumio/automation/api-token
  CodeVersion:
    Description: Build version of the bulk restore deployment. Stamped from the VERSION file at build time and surfaced as a stack Output for deployment auditing. Each Lambda's zip is keyed by version, so code updates happen automatically when a new build is deployed; this parameter is informational only.
    Type: String
    Default: '__BULK_RESTORE_VERSION__'
  PollingIntervalSeconds:
    Description: Seconds the state machine waits between Clumio restore-task status polls. Lower values detect completion sooner but generate more polling traffic; higher values reduce traffic for long-running restores.
    Type: Number
    Default: 60
    MinValue: 1
    MaxValue: 3600
  PollingMaxAttempts:
    Description: Maximum number of polling attempts before giving up on a single restore. Each attempt is one Task Lambda invocation that internally polls Clumio for up to ~10 minutes; default 200 covers ~48h of wall-time which is enough for restoring 64TB volumes. Increase for very large or slow restores.
    Type: Number
    Default: 200
    MinValue: 1
    MaxValue: 10000

Resources:
  BulkLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 7

  # ---------------------------------------------------------------------------
  # Restore-only Lambdas
  # ---------------------------------------------------------------------------
  ValidateInput:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Timeout: 120
      Role: !Ref LambdaIAMRole
      Handler: clumio_bulk_validate_input.lambda_handler
      Code:
        S3Bucket: !Ref LambdaCodeLocationBucket
        S3Key: !Sub '${LambdaZipObjectPrefix}-__BULK_RESTORE_VERSION__.zip'
      Description: !Sub 'Validates bulk restore input (v${CodeVersion})'
      TracingConfig:
        Mode: Active
      Environment:
        Variables:
          CLUMIO_TOKEN_ARN: !Ref ClumioTokenArn
      LoggingConfig:
        ApplicationLogLevel: INFO
        LogFormat: JSON
        LogGroup: !Ref BulkLogGroup
        SystemLogLevel: INFO
  Task:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Timeout: 800
      Role: !Ref LambdaIAMRole
      Handler: clumio_bulk_retrieve_restore_task.lambda_handler
      Code:
        S3Bucket: !Ref LambdaCodeLocationBucket
        S3Key: !Sub '${LambdaZipObjectPrefix}-__BULK_RESTORE_VERSION__.zip'
      Description: !Sub 'Retrieves and monitors restore task status (v${CodeVersion})'
      TracingConfig:
        Mode: Active
      Environment:
        Variables:
          CLUMIO_TOKEN_ARN: !Ref ClumioTokenArn
      LoggingConfig:
        ApplicationLogLevel: INFO
        LogFormat: JSON
        LogGroup: !Ref BulkLogGroup
        SystemLogLevel: INFO
  RestoreDDN:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Timeout: 600
      Role: !Ref LambdaIAMRole
      Handler: clumio_bulk_dynamodb_restore.lambda_handler
      Code:
        S3Bucket: !Ref LambdaCodeLocationBucket
        S3Key: !Sub '${LambdaZipObjectPrefix}-__BULK_RESTORE_VERSION__.zip'
      Description: !Sub 'Restores DynamoDB from Clumio backup (v${CodeVersion})'
      TracingConfig:
        Mode: Active
      Environment:
        Variables:
          CLUMIO_TOKEN_ARN: !Ref ClumioTokenArn
      LoggingConfig:
        ApplicationLogLevel: INFO
        LogFormat: JSON
        LogGroup: !Ref BulkLogGroup
        SystemLogLevel: INFO
  RestoreEC2:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Timeout: 600
      Role: !Ref LambdaIAMRole
      Handler: clumio_bulk_ec2_restore.lambda_handler
      Code:
        S3Bucket: !Ref LambdaCodeLocationBucket
        S3Key: !Sub '${LambdaZipObjectPrefix}-__BULK_RESTORE_VERSION__.zip'
      Description: !Sub 'Restores EC2 from Clumio backup (v${CodeVersion})'
      TracingConfig:
        Mode: Active
      Environment:
        Variables:
          CLUMIO_TOKEN_ARN: !Ref ClumioTokenArn
      LoggingConfig:
        ApplicationLogLevel: INFO
        LogFormat: JSON
        LogGroup: !Ref BulkLogGroup
        SystemLogLevel: INFO
  RestoreRDS:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Timeout: 600
      Role: !Ref LambdaIAMRole
      Handler: clumio_bulk_rds_restore.lambda_handler
      Code:
        S3Bucket: !Ref LambdaCodeLocationBucket
        S3Key: !Sub '${LambdaZipObjectPrefix}-__BULK_RESTORE_VERSION__.zip'
      Description: !Sub 'Restores RDS from Clumio backup (v${CodeVersion})'
      TracingConfig:
        Mode: Active
      Environment:
        Variables:
          CLUMIO_TOKEN_ARN: !Ref ClumioTokenArn
      LoggingConfig:
        ApplicationLogLevel: INFO
        LogFormat: JSON
        LogGroup: !Ref BulkLogGroup
        SystemLogLevel: INFO
  RestoreEBS:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Timeout: 600
      Role: !Ref LambdaIAMRole
      Handler: clumio_bulk_ebs_restore.lambda_handler
      Code:
        S3Bucket: !Ref LambdaCodeLocationBucket
        S3Key: !Sub '${LambdaZipObjectPrefix}-__BULK_RESTORE_VERSION__.zip'
      Description: !Sub 'Restores EBS from Clumio backup (v${CodeVersion})'
      TracingConfig:
        Mode: Active
      Environment:
        Variables:
          CLUMIO_TOKEN_ARN: !Ref ClumioTokenArn
      LoggingConfig:
        ApplicationLogLevel: INFO
        LogFormat: JSON
        LogGroup: !Ref BulkLogGroup
        SystemLogLevel: INFO
  RestorePG:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Timeout: 600
      Role: !Ref LambdaIAMRole
      Handler: clumio_bulk_s3_restore.lambda_handler
      Code:
        S3Bucket: !Ref LambdaCodeLocationBucket
        S3Key: !Sub '${LambdaZipObjectPrefix}-__BULK_RESTORE_VERSION__.zip'
      Description: !Sub 'Restores S3 Protection Group from Clumio backup (v${CodeVersion})'
      TracingConfig:
        Mode: Active
      Environment:
        Variables:
          CLUMIO_TOKEN_ARN: !Ref ClumioTokenArn
      LoggingConfig:
        ApplicationLogLevel: INFO
        LogFormat: JSON
        LogGroup: !Ref BulkLogGroup
        SystemLogLevel: INFO

  # ---------------------------------------------------------------------------
  # List-only Lambdas
  # ---------------------------------------------------------------------------
  InvokeAPI:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Timeout: 600
      Role: !Ref LambdaIAMRole
      Handler: clumio_bulk_invoke_rest_apis.lambda_handler
      Code:
        S3Bucket: !Ref LambdaCodeLocationBucket
        S3Key: !Sub '${LambdaZipObjectPrefix}-__BULK_RESTORE_VERSION__.zip'
      Description: !Sub 'Invokes various Clumio REST APIs (v${CodeVersion})'
      TracingConfig:
        Mode: Active
      Environment:
        Variables:
          CLUMIO_TOKEN_ARN: !Ref ClumioTokenArn
      LoggingConfig:
        ApplicationLogLevel: INFO
        LogFormat: JSON
        LogGroup: !Ref BulkLogGroup
        SystemLogLevel: INFO
  ListRegions:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Timeout: 120
      Role: !Ref LambdaIAMRole
      Handler: clumio_bulk_list_regions.lambda_handler
      Code:
        S3Bucket: !Ref LambdaCodeLocationBucket
        S3Key: !Sub '${LambdaZipObjectPrefix}-__BULK_RESTORE_VERSION__.zip'
      Description: !Sub 'Lists regions of given account (v${CodeVersion})'
      TracingConfig:
        Mode: Active
      Environment:
        Variables:
          CLUMIO_TOKEN_ARN: !Ref ClumioTokenArn
      LoggingConfig:
        ApplicationLogLevel: INFO
        LogFormat: JSON
        LogGroup: !Ref BulkLogGroup
        SystemLogLevel: INFO
  ListAssets:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Timeout: 600
      Role: !Ref LambdaIAMRole
      Handler: clumio_bulk_list_assets.lambda_handler
      Code:
        S3Bucket: !Ref LambdaCodeLocationBucket
        S3Key: !Sub '${LambdaZipObjectPrefix}-__BULK_RESTORE_VERSION__.zip'
      Description: !Sub 'Lists assets by account, region, and resource type (v${CodeVersion})'
      TracingConfig:
        Mode: Active
      Environment:
        Variables:
          CLUMIO_TOKEN_ARN: !Ref ClumioTokenArn
      LoggingConfig:
        ApplicationLogLevel: INFO
        LogFormat: JSON
        LogGroup: !Ref BulkLogGroup
        SystemLogLevel: INFO
  SortBackups:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Timeout: 120
      Role: !Ref LambdaIAMRole
      Handler: clumio_bulk_sort_list_backups.lambda_handler
      Code:
        S3Bucket: !Ref LambdaCodeLocationBucket
        S3Key: !Sub '${LambdaZipObjectPrefix}-__BULK_RESTORE_VERSION__.zip'
      Description: !Sub 'Sorts backup list by region and resource type (v${CodeVersion})'
      TracingConfig:
        Mode: Active
      Environment:
        Variables:
          CLUMIO_TOKEN_ARN: !Ref ClumioTokenArn
      LoggingConfig:
        ApplicationLogLevel: INFO
        LogFormat: JSON
        LogGroup: !Ref BulkLogGroup
        SystemLogLevel: INFO
  FormatOutput:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Timeout: 120
      Role: !Ref LambdaIAMRole
      Handler: clumio_bulk_format_output.lambda_handler
      Code:
        S3Bucket: !Ref LambdaCodeLocationBucket
        S3Key: !Sub '${LambdaZipObjectPrefix}-__BULK_RESTORE_VERSION__.zip'
      Description: !Sub 'Formats bulk list output (v${CodeVersion})'
      TracingConfig:
        Mode: Active
      Environment:
        Variables:
          CLUMIO_TOKEN_ARN: !Ref ClumioTokenArn
      LoggingConfig:
        ApplicationLogLevel: INFO
        LogFormat: JSON
        LogGroup: !Ref BulkLogGroup
        SystemLogLevel: INFO

  # ---------------------------------------------------------------------------
  # Shared list-backups Lambdas (used by both state machines)
  # ---------------------------------------------------------------------------
  ListDDN:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Timeout: 600
      Role: !Ref LambdaIAMRole
      Handler: clumio_bulk_dynamodb_list_backups.lambda_handler
      Code:
        S3Bucket: !Ref LambdaCodeLocationBucket
        S3Key: !Sub '${LambdaZipObjectPrefix}-__BULK_RESTORE_VERSION__.zip'
      Description: !Sub 'Lists DynamoDB backups (v${CodeVersion})'
      TracingConfig:
        Mode: Active
      Environment:
        Variables:
          CLUMIO_TOKEN_ARN: !Ref ClumioTokenArn
      LoggingConfig:
        ApplicationLogLevel: INFO
        LogFormat: JSON
        LogGroup: !Ref BulkLogGroup
        SystemLogLevel: INFO
  ListEC2:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Timeout: 600
      Role: !Ref LambdaIAMRole
      Handler: clumio_bulk_ec2_list_backups.lambda_handler
      Code:
        S3Bucket: !Ref LambdaCodeLocationBucket
        S3Key: !Sub '${LambdaZipObjectPrefix}-__BULK_RESTORE_VERSION__.zip'
      Description: !Sub 'Lists EC2 backups (v${CodeVersion})'
      TracingConfig:
        Mode: Active
      Environment:
        Variables:
          CLUMIO_TOKEN_ARN: !Ref ClumioTokenArn
      LoggingConfig:
        ApplicationLogLevel: INFO
        LogFormat: JSON
        LogGroup: !Ref BulkLogGroup
        SystemLogLevel: INFO
  ListRDS:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Timeout: 600
      Role: !Ref LambdaIAMRole
      Handler: clumio_bulk_rds_list_backups.lambda_handler
      Code:
        S3Bucket: !Ref LambdaCodeLocationBucket
        S3Key: !Sub '${LambdaZipObjectPrefix}-__BULK_RESTORE_VERSION__.zip'
      Description: !Sub 'Lists RDS backups (v${CodeVersion})'
      TracingConfig:
        Mode: Active
      Environment:
        Variables:
          CLUMIO_TOKEN_ARN: !Ref ClumioTokenArn
      LoggingConfig:
        ApplicationLogLevel: INFO
        LogFormat: JSON
        LogGroup: !Ref BulkLogGroup
        SystemLogLevel: INFO
  ListEBS:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Timeout: 600
      Role: !Ref LambdaIAMRole
      Handler: clumio_bulk_ebs_list_backups.lambda_handler
      Code:
        S3Bucket: !Ref LambdaCodeLocationBucket
        S3Key: !Sub '${LambdaZipObjectPrefix}-__BULK_RESTORE_VERSION__.zip'
      Description: !Sub 'Lists EBS backups (v${CodeVersion})'
      TracingConfig:
        Mode: Active
      Environment:
        Variables:
          CLUMIO_TOKEN_ARN: !Ref ClumioTokenArn
      LoggingConfig:
        ApplicationLogLevel: INFO
        LogFormat: JSON
        LogGroup: !Ref BulkLogGroup
        SystemLogLevel: INFO
  ListPG:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Timeout: 600
      Role: !Ref LambdaIAMRole
      Handler: clumio_bulk_s3_list_backups.lambda_handler
      Code:
        S3Bucket: !Ref LambdaCodeLocationBucket
        S3Key: !Sub '${LambdaZipObjectPrefix}-__BULK_RESTORE_VERSION__.zip'
      Description: !Sub 'Lists S3 Protection Group backups (v${CodeVersion})'
      TracingConfig:
        Mode: Active
      Environment:
        Variables:
          CLUMIO_TOKEN_ARN: !Ref ClumioTokenArn
      LoggingConfig:
        ApplicationLogLevel: INFO
        LogFormat: JSON
        LogGroup: !Ref BulkLogGroup
        SystemLogLevel: INFO

  # ---------------------------------------------------------------------------
  # State machines
  # ---------------------------------------------------------------------------
  BulkRestoreStateMachine:
    Type: "AWS::StepFunctions::StateMachine"
    Properties:
      RoleArn: !Ref LambdaIAMRole
      DefinitionString:
        !Sub |-
          {
            "Comment": "Clumio Bulk Restore",
            "StartAt": "Lambda Validate Input",
            "States": {
              "Lambda Validate Input": {
                "Type": "Task",
                "Resource": "arn:aws:states:::lambda:invoke",
                "OutputPath": "$.Payload",
                "Parameters": {
                  "Payload.$": "$",
                  "FunctionName": "${ValidateInput}:$LATEST"
                },
                "Retry": [
                  {
                    "ErrorEquals": [
                      "Lambda.ServiceException",
                      "Lambda.AWSLambdaException",
                      "Lambda.SdkClientException",
                      "Lambda.TooManyRequestsException"
                    ],
                    "IntervalSeconds": 1,
                    "MaxAttempts": 3,
                    "BackoffRate": 2,
                    "JitterStrategy": "FULL"
                  }
                ],
                "Next": "Check Validation Input"
              },
              "Check Validation Input": {
                "Type": "Choice",
                "Choices": [
                  {
                    "Variable": "$.status",
                    "NumericEquals": 200,
                    "Next": "Split Runs by Input Groups"
                  }
                ],
                "Default": "Bulk Restore Summary"
              },
              "Split Runs by Input Groups": {
                "Type": "Map",
                "ItemProcessor": {
                  "ProcessorConfig": {
                    "Mode": "INLINE"
                  },
                  "StartAt": "Choose Run Type by Input Group Resource Type: RDS, EC2, DynamoDB, EBS, ProtectionGroup",
                  "States": {
                    "Choose Run Type by Input Group Resource Type: RDS, EC2, DynamoDB, EBS, ProtectionGroup": {
                      "Type": "Choice",
                      "Choices": [
                        {
                          "Variable": "$.ResourceType",
                          "StringEquals": "RDS",
                          "Next": "Pass Inputs to List Backup Lambda RDS"
                        },
                        {
                          "Variable": "$.ResourceType",
                          "StringEquals": "EC2",
                          "Next": "Pass Inputs to List Backup Lambda EC2"
                        },
                        {
                          "Variable": "$.ResourceType",
                          "StringEquals": "DynamoDB",
                          "Next": "Pass Inputs to List Backup Lambda DynamoDB"
                        },
                        {
                          "Variable": "$.ResourceType",
                          "StringEquals": "EBS",
                          "Next": "Pass Inputs to List Backup Lambda EBS"
                        },
                        {
                          "Variable": "$.ResourceType",
                          "StringEquals": "ProtectionGroup",
                          "Next": "Pass Inputs to List Backup Lambda PG"
                        }
                      ],
                      "Default": "Fail Type/List"
                    },
                    "Pass Inputs to List Backup Lambda RDS": {
                      "Type": "Pass",
                      "Next": "Lambda List RDS Backups",
                      "Parameters": {
                        "clumio_token.$": "$$.Execution.Input.clumio_token",
                        "base_url.$": "$$.Execution.Input.base_url",
                        "target.$": "$.target",
                        "source_account.$": "$.target.source_account",
                        "source_region.$": "$.target.source_region",
                        "search_direction.$": "$.target.search_direction",
                        "search_tag_key.$": "$.target.search_tag_key",
                        "start_search_day_offset.$": "$.target.start_search_day_offset",
                        "end_search_day_offset.$": "$.target.end_search_day_offset",
                        "search_tag_value.$": "$.target.search_tag_value"
                      }
                    },
                    "Lambda List RDS Backups": {
                      "Type": "Task",
                      "Resource": "arn:aws:states:::lambda:invoke",
                      "OutputPath": "$.Payload",
                      "Parameters": {
                        "Payload.$": "$",
                        "FunctionName": "${ListRDS}:$LATEST"
                      },
                      "Retry": [
                        {
                          "ErrorEquals": [
                            "Lambda.ServiceException",
                            "Lambda.AWSLambdaException",
                            "Lambda.SdkClientException",
                            "Lambda.TooManyRequestsException"
                          ],
                          "IntervalSeconds": 1,
                          "MaxAttempts": 3,
                          "BackoffRate": 2
                        }
                      ],
                      "Next": "Check List RDS Lambda status"
                    },
                    "Check List RDS Lambda status": {
                      "Type": "Choice",
                      "Choices": [
                        {
                          "Variable": "$.status",
                          "NumericEquals": 200,
                          "Next": "Split Individual RDS Restores"
                        }
                      ],
                      "Default": "Fail Type/List"
                    },
                    "Split Individual RDS Restores": {
                      "Type": "Map",
                      "MaxConcurrency": 100,
                      "ToleratedFailurePercentage": 100,
                      "ItemProcessor": {
                        "ProcessorConfig": {
                          "Mode": "DISTRIBUTED",
                          "ExecutionType": "STANDARD"
                        },
                        "StartAt": "Pass Inputs to Restore RDS Lambda",
                        "States": {
                          "Pass Inputs to Restore RDS Lambda": {
                            "Type": "Pass",
                            "Next": "Lambda Restore RDS",
                            "Parameters": {
                              "clumio_token.$": "$$.Execution.Input.clumio_token",
                              "base_url.$": "$$.Execution.Input.base_url",
                              "record.$": "$.record",
                              "target.$": "$.target"
                            }
                          },
                          "Lambda Restore RDS": {
                            "Type": "Task",
                            "Resource": "arn:aws:states:::lambda:invoke",
                            "OutputPath": "$.Payload",
                            "Parameters": {
                              "Payload.$": "$",
                              "FunctionName": "${RestoreRDS}:$LATEST"
                            },
                            "Retry": [
                              {
                                "ErrorEquals": [
                                  "Lambda.ServiceException",
                                  "Lambda.AWSLambdaException",
                                  "Lambda.SdkClientException",
                                  "Lambda.TooManyRequestsException"
                                ],
                                "IntervalSeconds": 1,
                                "MaxAttempts": 3,
                                "BackoffRate": 2
                              }
                            ],
                            "Next": "Check Restore RDS Lambda status"
                          },
                          "Check Restore RDS Lambda status": {
                            "Type": "Choice",
                            "Choices": [
                              {
                                "Variable": "$.status",
                                "NumericEquals": 200,
                                "Next": "Pass inputs to Clumio Check Task Status RDS"
                              }
                            ],
                            "Default": "RDS Restore Lambda Fail"
                          },
                          "Pass inputs to Clumio Check Task Status RDS": {
                            "Type": "Pass",
                            "Next": "Lambda Clumio Check Task Status RDS",
                            "Parameters": {
                              "clumio_token.$": "$$.Execution.Input.clumio_token",
                              "base_url.$": "$$.Execution.Input.base_url",
                              "inputs.$": "$.inputs"
                            }
                          },
                          "Lambda Clumio Check Task Status RDS": {
                            "Type": "Task",
                            "Resource": "arn:aws:states:::lambda:invoke",
                            "OutputPath": "$.Payload",
                            "Parameters": {
                              "Payload.$": "$",
                              "FunctionName": "${Task}:$LATEST"
                            },
                            "Retry": [
                              {
                                "ErrorEquals": ["RestoreInProgress"],
                                "IntervalSeconds": ${PollingIntervalSeconds},
                                "MaxAttempts": ${PollingMaxAttempts},
                                "BackoffRate": 1.0
                              },
                              {
                                "ErrorEquals": [
                                  "Lambda.ServiceException",
                                  "Lambda.AWSLambdaException",
                                  "Lambda.SdkClientException",
                                  "Lambda.TooManyRequestsException"
                                ],
                                "IntervalSeconds": 1,
                                "MaxAttempts": 3,
                                "BackoffRate": 2
                              }
                            ],
                            "Catch": [
                              {
                                "ErrorEquals": ["RestoreInProgress"],
                                "Next": "RDS Restore Lambda Fail"
                              }
                            ],
                            "Next": "Task Status RDS"
                          },
                          "Task Status RDS": {
                            "Type": "Choice",
                            "Choices": [
                              {
                                "Variable": "$.status",
                                "NumericEquals": 200,
                                "Next": "Restore Summary RDS"
                              }
                            ],
                            "Default": "RDS Restore Lambda Fail"
                          },
                          "Restore Summary RDS": {
                            "Type": "Wait",
                            "Seconds": 5,
                            "End": true
                          },
                          "RDS Restore Lambda Fail": {
                            "Type": "Wait",
                            "Seconds": 5,
                            "End": true
                          }
                        }
                      },
                      "Next": "Input Group Summary",
                      "ItemsPath": "$.records",
                      "ItemSelector": {
                        "clumio_token.$": "$$.Execution.Input.clumio_token",
                        "base_url.$": "$$.Execution.Input.base_url",
                        "target.$": "$.target",
                        "record.$": "$$.Map.Item.Value"
                      }
                    },
                    "Input Group Summary": {
                      "Type": "Wait",
                      "Seconds": 5,
                      "End": true
                    },
                    "Fail Type/List": {
                      "Type": "Wait",
                      "Seconds": 5,
                      "End": true
                    },
                    "Pass Inputs to List Backup Lambda EC2": {
                      "Type": "Pass",
                      "Next": "Lambda List EC2 Backups",
                      "Parameters": {
                        "clumio_token.$": "$$.Execution.Input.clumio_token",
                        "base_url.$": "$$.Execution.Input.base_url",
                        "target.$": "$.target",
                        "source_account.$": "$.target.source_account",
                        "source_region.$": "$.target.source_region",
                        "search_direction.$": "$.target.search_direction",
                        "search_tag_key.$": "$.target.search_tag_key",
                        "start_search_day_offset.$": "$.target.start_search_day_offset",
                        "end_search_day_offset.$": "$.target.end_search_day_offset",
                        "search_tag_value.$": "$.target.search_tag_value"
                      }
                    },
                    "Lambda List EC2 Backups": {
                      "Type": "Task",
                      "Resource": "arn:aws:states:::lambda:invoke",
                      "OutputPath": "$.Payload",
                      "Parameters": {
                        "Payload.$": "$",
                        "FunctionName": "${ListEC2}:$LATEST"
                      },
                      "Retry": [
                        {
                          "ErrorEquals": [
                            "Lambda.ServiceException",
                            "Lambda.AWSLambdaException",
                            "Lambda.SdkClientException",
                            "Lambda.TooManyRequestsException"
                          ],
                          "IntervalSeconds": 1,
                          "MaxAttempts": 3,
                          "BackoffRate": 2
                        }
                      ],
                      "Next": "Check List EC2 Lambda status"
                    },
                    "Check List EC2 Lambda status": {
                      "Type": "Choice",
                      "Choices": [
                        {
                          "Variable": "$.status",
                          "NumericEquals": 200,
                          "Next": "Split Individual EC2 Restores"
                        }
                      ],
                      "Default": "Fail Type/List"
                    },
                    "Split Individual EC2 Restores": {
                      "Type": "Map",
                      "MaxConcurrency": 100,
                      "ToleratedFailurePercentage": 100,
                      "ItemProcessor": {
                        "ProcessorConfig": {
                          "Mode": "DISTRIBUTED",
                          "ExecutionType": "STANDARD"
                        },
                        "StartAt": "Pass Inputs to Restore EC2 Lambda",
                        "States": {
                          "Pass Inputs to Restore EC2 Lambda": {
                            "Type": "Pass",
                            "Next": "Lambda Restore EC2",
                            "Parameters": {
                              "clumio_token.$": "$$.Execution.Input.clumio_token",
                              "base_url.$": "$$.Execution.Input.base_url",
                              "record.$": "$.record",
                              "target.$": "$.target",
                              "target_account.$": "$.target.target_account",
                              "target_region.$": "$.target.target_region",
                              "target_az.$": "$.target.target_az",
