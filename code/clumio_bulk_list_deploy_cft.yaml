AWSTemplateFormatVersion: '2010-09-09'
Description: Clumio bulk list deployment
Parameters:
  LambdaCodeLocationBucket:
    Description: S3 Bucket that contains the lambda zip file
    Type: String
    Default: clumio-bulk-restore
  LambdaIAMRole:
    Description: Role to run lambda functions
    Type: String
    Default: arn:aws:iam::<account_id>:role/clumio-bulk-restore-role
  LambdaZipObjectPrefix:
    Description: Prefix of the Lambda zip object key in LambdaCodeLocationBucket. The build version is appended at deploy time (final key is "<prefix>-<version>.zip"), so each release pulls a unique S3 key and CloudFormation re-deploys the Lambda code.
    Type: String
    Default: clumio_bulk_restore
  ClumioTokenArn:
    Description: ARN of the Clumio token secret in AWS Secrets Manager, if left empty, API token has to be passed as input during state machine execution.
    Type: String
    Default: arn:aws:secretsmanager:<aws_region>:<aws_account_id>:secret:clumio/automation/api-token
  CodeVersion:
    Description: Build version of the bulk list deployment. Stamped from the VERSION file at build time and surfaced as a stack Output for deployment auditing. Each Lambda's zip is keyed by version, so code updates happen automatically when a new build is deployed; this parameter is informational only.
    Type: String
    Default: '__BULK_RESTORE_VERSION__'

Resources:
  ListLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 7
  InvokeAPI:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Timeout: 600
      Role: !Ref LambdaIAMRole
      Handler: clumio_bulk_invoke_rest_apis.lambda_handler
      Code:
        S3Bucket: !Ref LambdaCodeLocationBucket
        S3Key: !Sub '${LambdaZipObjectPrefix}-__BULK_RESTORE_VERSION__.zip'
      Description: !Sub 'Invokes various Clumio REST APIs (v${CodeVersion})'
      TracingConfig:
        Mode: Active
      Environment:
        Variables:
          CLUMIO_TOKEN_ARN: !Ref ClumioTokenArn
      LoggingConfig:
        ApplicationLogLevel: INFO
        LogFormat: JSON
        LogGroup: !Ref ListLogGroup
        SystemLogLevel: INFO
  ListRegions:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Timeout: 120
      Role: !Ref LambdaIAMRole
      Handler: clumio_bulk_list_regions.lambda_handler
      Code:
        S3Bucket: !Ref LambdaCodeLocationBucket
        S3Key: !Sub '${LambdaZipObjectPrefix}-__BULK_RESTORE_VERSION__.zip'
      Description: !Sub 'Lists regions of given account (v${CodeVersion})'
      TracingConfig:
        Mode: Active
      Environment:
        Variables:
          CLUMIO_TOKEN_ARN: !Ref ClumioTokenArn
      LoggingConfig:
        ApplicationLogLevel: INFO
        LogFormat: JSON
        LogGroup: !Ref ListLogGroup
        SystemLogLevel: INFO
  ListAssets:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Timeout: 600
      Role: !Ref LambdaIAMRole
      Handler: clumio_bulk_list_assets.lambda_handler
      Code:
        S3Bucket: !Ref LambdaCodeLocationBucket
        S3Key: !Sub '${LambdaZipObjectPrefix}-__BULK_RESTORE_VERSION__.zip'
      Description: !Sub 'Lists assets by account, region, and resource type (v${CodeVersion})'
      TracingConfig:
        Mode: Active
      Environment:
        Variables:
          CLUMIO_TOKEN_ARN: !Ref ClumioTokenArn
      LoggingConfig:
        ApplicationLogLevel: INFO
        LogFormat: JSON
        LogGroup: !Ref ListLogGroup
        SystemLogLevel: INFO
  ListDDN:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Timeout: 600
      Role: !Ref LambdaIAMRole
      Handler: clumio_bulk_dynamodb_list_backups.lambda_handler
      Code:
        S3Bucket: !Ref LambdaCodeLocationBucket
        S3Key: !Sub '${LambdaZipObjectPrefix}-__BULK_RESTORE_VERSION__.zip'
      Description: !Sub 'Lists latest DynamoDB backup (v${CodeVersion})'
      TracingConfig:
        Mode: Active
      Environment:
        Variables:
          CLUMIO_TOKEN_ARN: !Ref ClumioTokenArn
      LoggingConfig:
        ApplicationLogLevel: INFO
        LogFormat: JSON
        LogGroup: !Ref ListLogGroup
        SystemLogLevel: INFO
  ListEC2:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Timeout: 600
      Role: !Ref LambdaIAMRole
      Handler: clumio_bulk_ec2_list_backups.lambda_handler
      Code:
        S3Bucket: !Ref LambdaCodeLocationBucket
        S3Key: !Sub '${LambdaZipObjectPrefix}-__BULK_RESTORE_VERSION__.zip'
      Description: !Sub 'Lists latest EC2 backup (v${CodeVersion})'
      TracingConfig:
        Mode: Active
      Environment:
        Variables:
          CLUMIO_TOKEN_ARN: !Ref ClumioTokenArn
      LoggingConfig:
        ApplicationLogLevel: INFO
        LogFormat: JSON
        LogGroup: !Ref ListLogGroup
        SystemLogLevel: INFO
  ListRDS:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Timeout: 600
      Role: !Ref LambdaIAMRole
      Handler: clumio_bulk_rds_list_backups.lambda_handler
      Code:
        S3Bucket: !Ref LambdaCodeLocationBucket
        S3Key: !Sub '${LambdaZipObjectPrefix}-__BULK_RESTORE_VERSION__.zip'
      Description: !Sub 'Lists latest RDS backup (v${CodeVersion})'
      TracingConfig:
        Mode: Active
      Environment:
        Variables:
          CLUMIO_TOKEN_ARN: !Ref ClumioTokenArn
      LoggingConfig:
        ApplicationLogLevel: INFO
        LogFormat: JSON
        LogGroup: !Ref ListLogGroup
        SystemLogLevel: INFO
  ListEBS:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Timeout: 600
      Role: !Ref LambdaIAMRole
      Handler: clumio_bulk_ebs_list_backups.lambda_handler
      Code:
        S3Bucket: !Ref LambdaCodeLocationBucket
        S3Key: !Sub '${LambdaZipObjectPrefix}-__BULK_RESTORE_VERSION__.zip'
      Description: !Sub 'Lists latest EBS backup (v${CodeVersion})'
      TracingConfig:
        Mode: Active
      Environment:
        Variables:
          CLUMIO_TOKEN_ARN: !Ref ClumioTokenArn
      LoggingConfig:
        ApplicationLogLevel: INFO
        LogFormat: JSON
        LogGroup: !Ref ListLogGroup
        SystemLogLevel: INFO
  ListPG:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Timeout: 600
      Role: !Ref LambdaIAMRole
      Handler: clumio_bulk_s3_list_backups.lambda_handler
      Code:
        S3Bucket: !Ref LambdaCodeLocationBucket
        S3Key: !Sub '${LambdaZipObjectPrefix}-__BULK_RESTORE_VERSION__.zip'
      Description: !Sub 'Lists latest Protection Group backup (v${CodeVersion})'
      TracingConfig:
        Mode: Active
      Environment:
        Variables:
          CLUMIO_TOKEN_ARN: !Ref ClumioTokenArn
      LoggingConfig:
        ApplicationLogLevel: INFO
        LogFormat: JSON
        LogGroup: !Ref ListLogGroup
        SystemLogLevel: INFO
  SortBackups:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Timeout: 120
      Role: !Ref LambdaIAMRole
      Handler: clumio_bulk_sort_list_backups.lambda_handler
      Code:
        S3Bucket: !Ref LambdaCodeLocationBucket
        S3Key: !Sub '${LambdaZipObjectPrefix}-__BULK_RESTORE_VERSION__.zip'
      Description: !Sub 'Sorts backup list by region and resource type (v${CodeVersion})'
      TracingConfig:
        Mode: Active
      Environment:
        Variables:
          CLUMIO_TOKEN_ARN: !Ref ClumioTokenArn
      LoggingConfig:
        ApplicationLogLevel: INFO
        LogFormat: JSON
        LogGroup: !Ref ListLogGroup
        SystemLogLevel: INFO
  FormatOutput:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Timeout: 120
      Role: !Ref LambdaIAMRole
      Handler: clumio_bulk_format_output.lambda_handler
      Code:
        S3Bucket: !Ref LambdaCodeLocationBucket
        S3Key: !Sub '${LambdaZipObjectPrefix}-__BULK_RESTORE_VERSION__.zip'
      Description: !Sub 'Formats bulk list output (v${CodeVersion})'
      TracingConfig:
        Mode: Active
      Environment:
        Variables:
          CLUMIO_TOKEN_ARN: !Ref ClumioTokenArn
      LoggingConfig:
        ApplicationLogLevel: INFO
        LogFormat: JSON
        LogGroup: !Ref ListLogGroup
        SystemLogLevel: INFO
  BulkRestoreStepFunction:
    Type: "AWS::StepFunctions::StateMachine"
    Properties:
      RoleArn: !Ref LambdaIAMRole
      DefinitionString:
        !Sub |-
          {
            "QueryLanguage": "JSONPath",
            "Comment": "A description of my state machine",
            "StartAt": "Lambda List Regions",
            "States": {
              "Lambda List Regions": {
                "Type": "Task",
                "Resource": "arn:aws:states:::lambda:invoke",
                "Retry": [
                  {
                    "ErrorEquals": [
                      "Lambda.ServiceException",
                      "Lambda.AWSLambdaException",
                      "Lambda.SdkClientException",
                      "Lambda.TooManyRequestsException"
                    ],
                    "IntervalSeconds": 1,
                    "MaxAttempts": 3,
                    "BackoffRate": 2,
                    "JitterStrategy": "FULL"
                  }
                ],
                "Next": "Split Run per Individual Region",
                "Parameters": {
                  "FunctionName": "${ListRegions}:$LATEST",
                  "Payload.$": "$"
                },
                "OutputPath": "$.Payload"
              },
              "Split Run per Individual Region": {
                "Type": "Map",
                "ItemProcessor": {
                  "ProcessorConfig": {
                    "Mode": "INLINE"
                  },
                  "StartAt": "Split Run per Resource Type",
                  "States": {
                    "Split Run per Resource Type": {
                      "Type": "Map",
                      "ItemProcessor": {
                        "ProcessorConfig": {
                          "Mode": "INLINE"
                        },
                        "StartAt": "Pass Input to List Asset",
                        "States": {
                          "Pass Input to List Asset": {
                            "Type": "Pass",
                            "Parameters": {
                              "clumio_token.$": "$$.Execution.Input.clumio_token",
                              "base_url.$": "$$.Execution.Input.base_url",
                              "source_asset_types.$": "$$.Execution.Input.source_asset_types",
                              "asset_meta_status.$": "$$.Execution.Input.asset_meta_status",
                              "region.$": "$.region",
                              "resource_type.$": "$.resource_type"
                            },
                            "Next": "Choose Run by Resource Type"
                          },
                          "Choose Run by Resource Type": {
                            "Type": "Choice",
                            "Choices": [
                              {
                                "And":[
                                  {
                                    "Variable": "$.resource_type",
                                    "StringEquals": "EBS"
                                  },
                                  {
                                    "Variable": "$$.Execution.Input.source_asset_types.EBS",
                                    "IsPresent": true
                                  }
                                ],
                                "Next": "Lambda List EBS Assets"
                              },
                              {
                                "And":[
                                  {
                                    "Variable": "$.resource_type",
                                    "StringEquals": "EC2"
                                  },
                                  {
                                    "Variable": "$$.Execution.Input.source_asset_types.EC2",
                                    "IsPresent": true
                                  }
                                ],
                                "Next": "Lambda List EC2 Assets"
                              },
                              {
                                "And":[
                                  {
                                    "Variable": "$.resource_type",
                                    "StringEquals": "RDS"
                                  },
                                  {
                                    "Variable": "$$.Execution.Input.source_asset_types.RDS",
                                    "IsPresent": true
                                  }
                                ],
                                "Next": "Lambda List RDS Assets"
                              },
                              {
                                "And":[
                                  {
                                    "Variable": "$.resource_type",
                                    "StringEquals": "DynamoDB"
                                  },
                                  {
                                    "Variable": "$$.Execution.Input.source_asset_types.DynamoDB",
                                    "IsPresent": true
                                  }
                                ],
                                "Next": "Lambda List DynamoDB Assets"
                              },
                              {
                                "And":[
                                  {
                                    "Variable": "$.resource_type",
                                    "StringEquals": "ProtectionGroup"
                                  },
                                  {
                                    "Variable": "$$.Execution.Input.source_asset_types.ProtectionGroup",
                                    "IsPresent": true
                                  }
                                ],
                                "Next": "Lambda List PG Assets"
                              }
                            ],
                            "Default": "Fail Type/List"
                          },
                          "Lambda List DynamoDB Assets": {
                            "Type": "Task",
                            "Resource": "arn:aws:states:::lambda:invoke",
                            "OutputPath": "$.Payload",
                            "Parameters": {
                              "Payload.$": "$",
                              "FunctionName": "${ListAssets}:$LATEST"
                            },
                            "Retry": [
                              {
                                "ErrorEquals": [
                                  "Lambda.ServiceException",
                                  "Lambda.AWSLambdaException",
                                  "Lambda.SdkClientException",
                                  "Lambda.TooManyRequestsException"
                                ],
                                "IntervalSeconds": 1,
                                "MaxAttempts": 3,
                                "BackoffRate": 2,
                                "JitterStrategy": "FULL"
                              }
                            ],
                            "Next": "Split Run By DynamoDB Asset"
                          },
                          "Split Run By DynamoDB Asset": {
                            "Type": "Map",
                            "ItemProcessor": {
                              "ProcessorConfig": {
                                "Mode": "INLINE"
                              },
                              "StartAt": "Lambda List DynamoDB Latest Backup",
                              "States": {
                                "Lambda List DynamoDB Latest Backup": {
                                  "Type": "Task",
                                  "Resource": "arn:aws:states:::lambda:invoke",
                                  "OutputPath": "$.Payload",
                                  "Parameters": {
                                    "Payload.$": "$",
                                    "FunctionName": "${ListDDN}:$LATEST"
                                  },
                                  "Retry": [
                                    {
                                      "ErrorEquals": [
                                        "Lambda.ServiceException",
                                        "Lambda.AWSLambdaException",
                                        "Lambda.SdkClientException",
                                        "Lambda.TooManyRequestsException"
                                      ],
                                      "IntervalSeconds": 1,
                                      "MaxAttempts": 3,
                                      "BackoffRate": 2,
                                      "JitterStrategy": "FULL"
                                    }
                                  ],
                                  "Next": "Check for DynamoDB List Backup Throttling"
                                },
                                "Check for DynamoDB List Backup Throttling": {
                                  "Type": "Choice",
                                  "Choices": [
                                    {
                                      "And": [
                                        {
                                          "Variable": "$.status",
                                          "NumericEquals": 401
                                        },
                                        {
                                          "Variable": "$.msg",
                                          "StringMatches": "*throttling*"
                                        }
                                      ],
                                      "Next": "DynamoDB List Backoff"
                                    }
                                  ],
                                  "Default": "List DynamoDB Backup Success"
                                },
                                "List DynamoDB Backup Success": {
                                  "Type": "Succeed"
                                },
                                "DynamoDB List Backoff": {
                                  "Type": "Wait",
                                  "Seconds": 1,
                                  "Next": "Lambda List DynamoDB Latest Backup"
                                }
                              }
                            },
                            "ItemsPath": "$.asset_ids",
                            "ItemSelector": {
                              "clumio_token.$": "$$.Execution.Input.clumio_token",
                              "base_url.$": "$$.Execution.Input.base_url",
                              "source_account.$": "$$.Execution.Input.source_account",
                              "source_region.$": "$.region",
                              "search_table_id.$": "$$.Map.Item.Value",
                              "target_specs.$": "$$.Execution.Input.target_specs",
                              "target": {
                                "search_direction": "before"
                              }
                            },
                            "Next": "Pass DynamoDB List Backup to Sort Lambda"
                          },
                          "Pass DynamoDB List Backup to Sort Lambda": {
                            "Type": "Pass",
                            "Parameters": {
                              "resource_type": "DynamoDB",
                              "backup_list.$": "$"
                            },
                            "Next": "Lambda Sort DynamoDB Backup List"
                          },
                          "Lambda Sort DynamoDB Backup List": {
                            "Type": "Task",
                            "Resource": "arn:aws:states:::lambda:invoke",
                            "OutputPath": "$.Payload",
                            "Parameters": {
                              "Payload.$": "$",
                              "FunctionName": "${SortBackups}:$LATEST"
                            },
                            "Retry": [
                              {
                                "ErrorEquals": [
                                  "Lambda.ServiceException",
                                  "Lambda.AWSLambdaException",
                                  "Lambda.SdkClientException",
                                  "Lambda.TooManyRequestsException"
                                ],
                                "IntervalSeconds": 1,
                                "MaxAttempts": 3,
                                "BackoffRate": 2,
                                "JitterStrategy": "FULL"
                              }
                            ],
                            "End": true
                          },
                          "Lambda List RDS Assets": {
                            "Type": "Task",
                            "Resource": "arn:aws:states:::lambda:invoke",
                            "OutputPath": "$.Payload",
                            "Parameters": {
                              "Payload.$": "$",
                              "FunctionName": "${ListAssets}:$LATEST"
                            },
                            "Retry": [
                              {
                                "ErrorEquals": [
                                  "Lambda.ServiceException",
                                  "Lambda.AWSLambdaException",
                                  "Lambda.SdkClientException",
                                  "Lambda.TooManyRequestsException"
                                ],
                                "IntervalSeconds": 1,
                                "MaxAttempts": 3,
                                "BackoffRate": 2,
                                "JitterStrategy": "FULL"
                              }
                            ],
                            "Next": "Split Run By RDS Asset"
                          },
                          "Split Run By RDS Asset": {
                            "Type": "Map",
                            "ItemProcessor": {
                              "ProcessorConfig": {
                                "Mode": "INLINE"
                              },
                              "StartAt": "Lambda List RDS Latest Backup",
                              "States": {
                                "Lambda List RDS Latest Backup": {
                                  "Type": "Task",
                                  "Resource": "arn:aws:states:::lambda:invoke",
                                  "OutputPath": "$.Payload",
                                  "Parameters": {
                                    "Payload.$": "$",
                                    "FunctionName": "${ListRDS}:$LATEST"
                                  },
                                  "Retry": [
                                    {
                                      "ErrorEquals": [
                                        "Lambda.ServiceException",
                                        "Lambda.AWSLambdaException",
                                        "Lambda.SdkClientException",
                                        "Lambda.TooManyRequestsException"
                                      ],
                                      "IntervalSeconds": 1,
                                      "MaxAttempts": 3,
                                      "BackoffRate": 2,
                                      "JitterStrategy": "FULL"
                                    }
                                  ],
                                  "Next": "Check for RDS List Backup Throttling"
                                },
                                "Check for RDS List Backup Throttling": {
                                  "Type": "Choice",
                                  "Choices": [
                                    {
                                      "And": [
                                        {
                                          "Variable": "$.status",
                                          "NumericEquals": 401
                                        },
                                        {
                                          "Variable": "$.msg",
                                          "StringMatches": "*throttling*"
                                        }
                                      ],
                                      "Next": "RDS List Backoff"
                                    }
                                  ],
                                  "Default": "List RDS Backup Success"
                                },
                                "List RDS Backup Success": {
                                  "Type": "Succeed"
                                },
                                "RDS List Backoff": {
                                  "Type": "Wait",
                                  "Seconds": 1,
                                  "Next": "Lambda List RDS Latest Backup"
                                }
                              }
                            },
                            "ItemsPath": "$.asset_ids",
                            "ItemSelector": {
                              "clumio_token.$": "$$.Execution.Input.clumio_token",
                              "base_url.$": "$$.Execution.Input.base_url",
                              "source_account.$": "$$.Execution.Input.source_account",
                              "source_region.$": "$.region",
                              "search_resource_id.$": "$$.Map.Item.Value",
                              "target_specs.$": "$$.Execution.Input.target_specs",
                              "target": {
                                "search_direction": "before"
                              }
                            },
                            "Next": "Pass RDS List Backup to Sort Lambda"
                          },
                          "Pass RDS List Backup to Sort Lambda": {
                            "Type": "Pass",
                            "Parameters": {
                              "resource_type": "RDS",
                              "backup_list.$": "$"
                            },
                            "Next": "Lambda Sort RDS Backup List"
                          },
                          "Lambda Sort RDS Backup List": {
                            "Type": "Task",
                            "Resource": "arn:aws:states:::lambda:invoke",
                            "OutputPath": "$.Payload",
                            "Parameters": {
                              "Payload.$": "$",
                              "FunctionName": "${SortBackups}:$LATEST"
                            },
                            "Retry": [
                              {
                                "ErrorEquals": [
                                  "Lambda.ServiceException",
                                  "Lambda.AWSLambdaException",
                                  "Lambda.SdkClientException",
                                  "Lambda.TooManyRequestsException"
                                ],
                                "IntervalSeconds": 1,
                                "MaxAttempts": 3,
                                "BackoffRate": 2,
                                "JitterStrategy": "FULL"
                              }
                            ],
                            "End": true
                          },
                          "Lambda List EBS Assets": {
                            "Type": "Task",
                            "Resource": "arn:aws:states:::lambda:invoke",
                            "OutputPath": "$.Payload",
                            "Parameters": {
                              "Payload.$": "$",
                              "FunctionName": "${ListAssets}:$LATEST"
                            },
                            "Retry": [
                              {
                                "ErrorEquals": [
                                  "Lambda.ServiceException",
                                  "Lambda.AWSLambdaException",
                                  "Lambda.SdkClientException",
                                  "Lambda.TooManyRequestsException"
                                ],
                                "IntervalSeconds": 1,
                                "MaxAttempts": 3,
                                "BackoffRate": 2,
                                "JitterStrategy": "FULL"
                              }
                            ],
                            "Next": "Split Run By EBS Asset"
                          },
                          "Split Run By EBS Asset": {
                            "Type": "Map",
                            "ItemProcessor": {
                              "ProcessorConfig": {
                                "Mode": "INLINE"
                              },
                              "StartAt": "Lambda List EBS Latest Backup",
                              "States": {
                                "Lambda List EBS Latest Backup": {
                                  "Type": "Task",
                                  "Resource": "arn:aws:states:::lambda:invoke",
                                  "OutputPath": "$.Payload",
                                  "Parameters": {
                                    "Payload.$": "$",
                                    "FunctionName": "${ListEBS}:$LATEST"
                                  },
                                  "Retry": [
                                    {
                                      "ErrorEquals": [
                                        "Lambda.ServiceException",
                                        "Lambda.AWSLambdaException",
                                        "Lambda.SdkClientException",
                                        "Lambda.TooManyRequestsException"
                                      ],
                                      "IntervalSeconds": 1,
                                      "MaxAttempts": 3,
                                      "BackoffRate": 2,
                                      "JitterStrategy": "FULL"
                                    }
                                  ],
                                  "Next": "Check for EBS List Backup Throttling"
                                },
                                "Check for EBS List Backup Throttling": {
                                  "Type": "Choice",
                                  "Choices": [
                                    {
                                      "And": [
                                        {
                                          "Variable": "$.status",
                                          "NumericEquals": 401
                                        },
                                        {
                                          "Variable": "$.msg",
                                          "StringMatches": "*throttling*"
                                        }
                                      ],
                                      "Next": "EBS List Backoff"
                                    }
                                  ],
                                  "Default": "List EBS Backup Success"
                                },
                                "List EBS Backup Success": {
                                  "Type": "Succeed"
                                },
                                "EBS List Backoff": {
                                  "Type": "Wait",
                                  "Seconds": 1,
                                  "Next": "Lambda List EBS Latest Backup"
                                }
                              }
                            },
                            "ItemsPath": "$.asset_ids",
                            "ItemSelector": {
                              "clumio_token.$": "$$.Execution.Input.clumio_token",
                              "base_url.$": "$$.Execution.Input.base_url",
                              "source_account.$": "$$.Execution.Input.source_account",
                              "source_region.$": "$.region",
                              "search_volume_id.$": "$$.Map.Item.Value",
                              "target_specs.$": "$$.Execution.Input.target_specs",
                              "target": {
                                "search_direction": "before"
                              }
                            },
                            "Next": "Pass EBS List Backup to Sort Lambda"
                          },
                          "Pass EBS List Backup to Sort Lambda": {
                            "Type": "Pass",
                            "Parameters": {
                              "resource_type": "EBS",
                              "backup_list.$": "$"
                            },
                            "Next": "Lambda Sort EBS Backup List"
                          },
                          "Lambda Sort EBS Backup List": {
                            "Type": "Task",
                            "Resource": "arn:aws:states:::lambda:invoke",
                            "OutputPath": "$.Payload",
                            "Parameters": {
                              "Payload.$": "$",
                              "FunctionName": "${SortBackups}:$LATEST"
                            },
                            "Retry": [
                              {
                                "ErrorEquals": [
                                  "Lambda.ServiceException",
                                  "Lambda.AWSLambdaException",
                                  "Lambda.SdkClientException",
                                  "Lambda.TooManyRequestsException"
                                ],
                                "IntervalSeconds": 1,
                                "MaxAttempts": 3,
                                "BackoffRate": 2,
                                "JitterStrategy": "FULL"
                              }
                            ],
                            "End": true
                          },
                          "Fail Type/List": {
                            "Type": "Wait",
                            "Seconds": 5,
                            "End": true
                          },
                          "Lambda List EC2 Assets": {
                            "Type": "Task",
                            "Resource": "arn:aws:states:::lambda:invoke",
                            "OutputPath": "$.Payload",
                            "Parameters": {
                              "Payload.$": "$",
                              "FunctionName": "${ListAssets}:$LATEST"
                            },
                            "Retry": [
                              {
                                "ErrorEquals": [
                                  "Lambda.ServiceException",
                                  "Lambda.AWSLambdaException",
                                  "Lambda.SdkClientException",
